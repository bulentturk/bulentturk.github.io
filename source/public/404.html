<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f5f2eb" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Sayfa bulunamadı | Engineering Tools</title>
    <style>
      :root {
        color: #102232;
        background: #f5f2eb;
        font-family: "Segoe UI", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        display: grid;
        margin: 0;
        min-height: 100vh;
        padding: 40px;
      }

      main {
        margin: 0 auto;
        max-width: 720px;
        width: 100%;
      }

      small {
        color: #087f8c;
        font-family: "Cascadia Mono", Consolas, monospace;
        font-weight: 700;
        letter-spacing: 0.14em;
      }

      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(56px, 10vw, 108px);
        font-weight: 400;
        letter-spacing: -0.06em;
        line-height: 0.95;
        margin: 24px 0;
      }

      p {
        color: #455462;
        font-size: 19px;
        line-height: 1.65;
        max-width: 560px;
      }

      a {
        border-bottom: 2px solid #087f8c;
        color: #102232;
        display: inline-block;
        font-weight: 700;
        margin-top: 20px;
        padding: 10px 0;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <small>404 / ENGINEERING TOOLS</small>
      <h1>Sayfa bulunamadı.</h1>
      <p>
        Aradığınız adres taşınmış veya artık mevcut olmayabilir. Ana sayfaya dönerek
        mühendislik araçlarına ulaşabilirsiniz.
      </p>
      <a href="/">Ana sayfaya dön →</a>
    </main>
  </body>
</html>
