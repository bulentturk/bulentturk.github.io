    <rect x="224" y="8" width="64" height="52" rx="14" transform="rotate(240 256 256)"/>
    <rect x="224" y="8" width="64" height="52" rx="14" transform="rotate(270 256 256)"/>
    <rect x="224" y="8" width="64" height="52" rx="14" transform="rotate(300 256 256)"/>
    <rect x="224" y="8" width="64" height="52" rx="14" transform="rotate(330 256 256)"/>
