    Dış halka: 12 dişli; içte 3 kişilik ekip (1 büyük + 2 küçük).
    Marka teal'i: #0ca5bc (logodan örneklenmiştir). Şeffaf zeminli.
  -->
  <g fill="#0ca5bc">
    <rect x="224" y="8" width="64" height="52" rx="14"/>
    <rect x="224" y="8" width="64" height="52" rx="14" transform="rotate(30 256 256)"/>
    <rect x="224" y="8" width="64" height="52" rx="14" transform="rotate(60 256 256)"/>
