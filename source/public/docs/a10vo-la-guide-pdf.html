<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ALGO TEAM · A10VO LA Guide PDF</title><style>:root{--bg:#f3f1ea;--ink:#102232;--muted:#65717a;--accent:#087f8c;--line:#d8d3c5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.box{max-width:720px;margin:12vh auto;padding:34px;background:white;border:1px solid var(--line);border-radius:8px}.mark{font-weight:800;color:var(--accent);letter-spacing:.08em}.msg{line-height:1.6;color:var(--muted)}.btn{border:0;background:var(--ink);color:white;padding:11px 17px;border-radius:5px;font:inherit;cursor:pointer}.btn:disabled{opacity:.5}</style><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script></head><body><main class="box"><div class="mark">ALGO TEAM · ENGINEERING GUIDES</div><h1 id="title"></h1><p class="msg" id="msg"></p><button class="btn" id="download"></button></main><script>(function(){const q=new URLSearchParams(location.search),lang=q.get('lang')==='en'?'en':'tr';document.documentElement.lang=lang;const C={ink:'#102232',muted:'#65717a',accent:'#087f8c',line:'#d8d3c5',bg:'#f3f1ea',hot:'#c0451b',pilot:'#b98c15'};const T=lang==='tr'?{title:'A10VO LA Güç Kontrolü — Çalışma Mantığı ve Simülasyon Kılavuzu',sub:'Bosch Rexroth A10VO Series 32 · LA.D / LA.DG / LA.S / LA.DS',button:'Türkçe PDF’yi indir',ready:'Kılavuz tarayıcınızda oluşturulur ve PDF olarak indirilir.',working:'PDF hazırlanıyor…',file:'a10vo-la-guc-kontrolu-kilavuzu-tr.pdf',core:'LA kontrolünün özü',coreb:'Çalışma basıncı yükseldikçe LA regülatörü pompanın swashplate açısını ve deplasmanını küçültür. Böylece pompanın çektiği mil torku yaklaşık sabit tutulur. Devir sabitse sabit tork yaklaşık sabit güce karşılık gelir.',why:'1 · LA neden vardır?',whyb:'Değişken deplasmanlı eksenel pistonlu pompa yüksek basınçta maksimum deplasmanda kalırsa tahrik motorundan çok yüksek tork ister. LA bu talebi sınırlar: p yükselirken Vg ve q düşer. Fazla debiyi relief üzerinden ısıya çevirmek yerine pompa baştan daha az debi üretir.',eq:'2 · Temel denklemler',flow:'Debi',torque:'Mil torku',power:'Mil gücü',eqnote:'Kritik çıkarım: M ∝ Vg × p. Sabit tork için basınç arttığında Vg ters orantılı küçülmelidir. Sabit devirde q ∝ Vg olduğundan p × q yaklaşık sabit kalır.',loop:'3 · Kapalı çevrim',loopb:'B/P hattındaki çalışma basıncı regülatöre geri beslenir. Regülatör servo piston üzerindeki kontrol basıncını değiştirir; servo piston swashplate açısını değiştirir. Basınç düşünce süreç tersine döner ve pompa daha büyük deplasmana döner.',regions:'4 · Üç çalışma bölgesi',r1:'I · Vg max — Basınç düşükken tork limiti aşılmaz; pompa maksimum deplasmanda çalışır.',r2:'II · LA bölgesi — Kontrol başlangıcından sonra basınç arttıkça Vg ve q düşer; tork ayar civarında kalır.',r3:'III · Basınç kesme — D içeren varyantta DR/DRG ayarına yaklaşınca pompa minimum deplasmana destroke eder.',ex:'5 · Örnek: NG71 · 20 kW @ 1500 d/dak',exnote:'Eğitim hesabı: Vg max=71.1 cm³/dev, ηv=0.95, ηhm=0.92. 20 kW @1500 d/dak ≈127.3 Nm tork ayarıdır. Bu varsayımlarla LA yaklaşık 103.5 bar’da devreye girer ve LA7 bandına düşer.',cls:'6 · LA5–LA9 sınıfları',clsn:'LA5–LA9 maksimum basınç kodları değildir; güç/tork kontrolünün başlayacağı basınç bandını ve boyuta göre tork aralığını tanımlar.',variants:'7 · LA.D / LA.DG / LA.S / LA.DS',v1:'LA.D — Güç/tork + yerel DR basınç kesme.',v2:'LA.DG — Güç/tork + X hattından uzaktan DRG basınç kesme.',v3:'LA.S — Güç/tork + ayrı debi kontrolü; debi kontrolü güç eğrisinin altında.',v4:'LA.DS — Güç/tork + basınç + debi kontrolü.',priority:'Kontrol önceliği için pratik model: Vg’yi en fazla küçültmek isteyen kontrol çalışma noktasını sınırlar. Rexroth DRS açıklamasında “Vg reduction has priority” ifadesini kullanır.',test:'8 · ALGO TEAM’de nasıl test edilir?',testb:'Hidrolik Devre Simülatörü’nde A10VO LA.D pompayı tank, yön valfi ve silindir/hidromotorla bağlayın. Önerilen test: NG71, 1500 d/dak, 20 kW @1500, DR=280 bar. Basıncı/yükü 80 → 150 → 200 → 250 → 280 bar adımlarında artırıp Vg, debi ve torku karşılaştırın.',notes:'9 · Model sınırları ve kaynak',notesb:'Simülatör eğitim ve ön boyutlandırma içindir; gerçek spool dinamiği, yay geometrisi, pilot gecikmesi, toleranslar, gerçek verim haritaları ve viskozite/sıcaklık etkileri sadeleştirilmiştir. Nihai seçim için güncel üretici verisi ve uygulama mühendisliği doğrulaması gerekir.',source:'Kaynak: Bosch Rexroth · A10VO Series 32 · RE 92705/2019-03-25 · özellikle s.7 ve s.9–14.'}:{title:'A10VO LA Power Control — Operating Principle and Simulation Guide',sub:'Bosch Rexroth A10VO Series 32 · LA.D / LA.DG / LA.S / LA.DS',button:'Download English PDF',ready:'The guide is generated in your browser and downloaded as a PDF.',working:'Preparing PDF…',file:'a10vo-la-power-controller-guide-en.pdf',core:'Core idea of LA control',coreb:'As working pressure rises, the LA regulator reduces swashplate angle and pump displacement. This keeps input shaft torque approximately constant. At constant speed, constant torque corresponds to approximately constant power.',why:'1 · Why is LA control used?',whyb:'If a variable-displacement axial-piston pump remains at maximum displacement while pressure rises, prime-mover torque demand becomes very high. LA limits this demand: Vg and q decrease as p rises. Instead of wasting excess main flow across a relief valve, the pump produces less flow in the first place.',eq:'2 · Core equations',flow:'Flow',torque:'Shaft torque',power:'Shaft power',eqnote:'Key deduction: M ∝ Vg × p. To hold torque constant, Vg must decrease roughly inversely with pressure. At constant speed q ∝ Vg, so p × q remains approximately constant.',loop:'3 · Closed control loop',loopb:'Working pressure from the B/P line is fed back to the regulator. The regulator changes control pressure on the servo piston; the servo piston changes swashplate angle. When pressure falls, the process reverses and the pump returns toward a larger displacement.',regions:'4 · Three operating regions',r1:'I · Vg max — At low pressure the torque limit is not reached; the pump stays at maximum displacement.',r2:'II · LA region — After the control-start point, Vg and q decrease as pressure rises while torque remains near its setting.',r3:'III · Pressure cut-off — In D variants, DR/DRG becomes dominant near its setting and the pump destrokes toward minimum displacement.',ex:'5 · Example: NG71 · 20 kW @ 1500 rpm',exnote:'Educational assumptions: Vg max=71.1 cm³/rev, ηv=0.95, ηhm=0.92. 20 kW @1500 rpm corresponds to ≈127.3 Nm. With these assumptions LA starts at ≈103.5 bar, inside the LA7 band.',cls:'6 · LA5–LA9 classes',clsn:'LA5–LA9 are not maximum-pressure codes; they define the pressure band where power/torque control begins and the allowed torque range for each frame size.',variants:'7 · LA.D / LA.DG / LA.S / LA.DS',v1:'LA.D — Power/torque + local DR pressure cut-off.',v2:'LA.DG — Power/torque + remote DRG pressure cut-off through port X.',v3:'LA.S — Power/torque + separate flow control; flow control operates below the power curve.',v4:'LA.DS — Power/torque + pressure + flow control.',priority:'Practical priority model: the controller demanding the greatest displacement reduction limits the operating point. Rexroth explicitly states “Vg reduction has priority” for the DRS controller combination.',test:'8 · How to test it on ALGO TEAM',testb:'In the Hydraulic Circuit Simulator, connect the A10VO LA.D pump to a tank, directional valve and cylinder/hydraulic motor. Suggested test: NG71, 1500 rpm, 20 kW @1500, DR=280 bar. Increase load/pressure through 80 → 150 → 200 → 250 → 280 bar and compare Vg, flow and torque.',notes:'9 · Model limits and source',notesb:'The simulator is intended for education and preliminary sizing. Real spool dynamics, spring geometry, pilot delay, tolerances, real efficiency maps and viscosity/temperature effects are simplified. Final selection must be verified against current manufacturer data and application-engineering requirements.',source:'Source: Bosch Rexroth · A10VO Series 32 · RE 92705/2019-03-25 · especially p.7 and pp.9–14.'};document.getElementById('title').textContent=T.title;document.getElementById('msg').textContent=T.ready;const btn=document.getElementById('download');btn.textContent=T.button;function wrap(x,s,a,b,w,lh,n=99){const q=s.split(/\s+/);let l='',k=0;for(const z of q){const t=l?l+' '+z:z;if(x.measureText(t).width>w&&l){x.fillText(l,a,b);b+=lh;k++;l=z;if(k>=n)return b}else l=t}if(l&&k<n){x.fillText(l,a,b);b+=lh}return b}function page(){const c=document.createElement('canvas');c.width=1240;c.height=1754;const x=c.getContext('2d');x.fillStyle='white';x.fillRect(0,0,1240,1754);return[c,x]}function head(x,k,h,s){x.fillStyle=C.accent;x.font='700 24px system-ui';x.fillText('ALGO TEAM · '+k,86,92);x.fillStyle=C.ink;x.font='700 48px system-ui';let y=wrap(x,h,86,164,1068,58,3);x.fillStyle=C.muted;x.font='26px system-ui';y=wrap(x,s,86,y+8,1068,38,3);x.strokeStyle=C.line;x.beginPath();x.moveTo(86,y+25);x.lineTo(1154,y+25);x.stroke();return y+70}function H(x,s,y){x.fillStyle=C.ink;x.font='700 31px system-ui';x.fillText(s,86,y);return y+48}function body(x,s,y){x.fillStyle=C.ink;x.font='23px system-ui';return wrap(x,s,86,y,1068,34,20)+10}function call(x,h,s,y){x.fillStyle='#e8f3f3';x.fillRect(86,y,1068,190);x.strokeStyle=C.accent;x.strokeRect(86,y,1068,190);x.fillStyle=C.accent;x.font='700 25px system-ui';x.fillText(h,112,y+42);x.fillStyle=C.ink;x.font='23px system-ui';wrap(x,s,112,y+80,1016,33,4);return y+220}function foot(x,n){x.strokeStyle=C.line;x.beginPath();x.moveTo(86,1665);x.lineTo(1154,1665);x.stroke();x.fillStyle=C.muted;x.font='18px system-ui';x.fillText('ALGO TEAM Engineering Tools · A10VO LA',86,1702);x.textAlign='right';x.fillText(String(n),1154,1702);x.textAlign='left'}function pump(x,y){x.strokeStyle=C.ink;x.lineWidth=5;x.beginPath();x.arc(245,y+160,88,0,Math.PI*2);x.stroke();x.fillStyle=C.ink;x.beginPath();x.moveTo(245,y+85);x.lineTo(210,y+150);x.lineTo(280,y+150);x.closePath();x.fill();x.strokeStyle=C.accent;x.lineWidth=8;x.beginPath();x.moveTo(170,y+230);x.lineTo(320,y+90);x.stroke();x.fillStyle='#f3f1ea';x.strokeStyle=C.ink;x.lineWidth=4;x.fillRect(500,y+100,230,120);x.strokeRect(500,y+100,230,120);x.fillStyle=C.ink;x.font='700 30px system-ui';x.fillText('LA',595,y+155);x.fillStyle=C.muted;x.font='22px system-ui';x.fillText(lang==='tr'?'güç/tork regülatörü':'power/torque regulator',516,y+193);x.fillStyle='white';x.fillRect(890,y+110,170,100);x.strokeRect(890,y+110,170,100);x.strokeStyle=C.hot;x.beginPath();x.moveTo(245,y+72);x.lineTo(615,y+72);x.lineTo(615,y+100);x.stroke();x.fillStyle=C.hot;x.font='21px system-ui';x.fillText(lang==='tr'?'B/P basınç geri besleme':'B/P pressure feedback',620,y+78);x.strokeStyle=C.pilot;x.setLineDash([12,10]);x.beginPath();x.moveTo(730,y+160);x.lineTo(890,y+160);x.stroke();x.setLineDash([]);x.fillStyle=C.muted;x.font='21px system-ui';x.fillText(lang==='tr'?'servo piston':'servo piston',910,y+245)}function formulas(x,y){for(const r of[[T.flow,'q = Vg · n · ηv / 1000'],[T.torque,'M = Vg · Δp / (20π · ηhm)'],[T.power,'P = 2π · M · n / 60000']]){x.fillStyle=C.bg;x.fillRect(86,y,1068,86);x.fillStyle=C.ink;x.font='700 23px system-ui';x.fillText(r[0],110,y+36);x.font='24px ui-monospace,monospace';x.fillText(r[1],390,y+36);y+=99}return y}function chart(x,y){const L=150,R=1110,U=y+35,B=y+510,W=R-L,H=B-U;x.strokeStyle=C.ink;x.lineWidth=3;x.beginPath();x.moveTo(L,U);x.lineTo(L,B);x.lineTo(R,B);x.stroke();x.fillStyle=C.muted;x.font='18px system-ui';for(let p=0;p<=300;p+=50){const a=L+W*p/300;x.strokeStyle=C.line;x.beginPath();x.moveTo(a,U);x.lineTo(a,B);x.stroke();x.fillText(String(p),a-10,B+28)}for(let q=0;q<=100;q+=25){const b=B-H*q/110;x.beginPath();x.moveTo(L,b);x.lineTo(R,b);x.stroke();x.fillText(String(q),L-48,b+6)}const ev=.95,em=.92,V=71.1,n=1500,M=20*60000/(2*Math.PI*1500),ps=M*20*Math.PI*em/V;x.strokeStyle=C.accent;x.lineWidth=7;x.beginPath();for(let p=5;p<=280;p+=2){const vg=Math.min(V,M*20*Math.PI*em/p),qq=vg*n*ev/1000,a=L+W*p/300,b=B-H*qq/110;p===5?x.moveTo(a,b):x.lineTo(a,b)}x.lineTo(L+W*280/300,B);x.stroke();const a=L+W*ps/300;x.strokeStyle=C.pilot;x.setLineDash([12,10]);x.beginPath();x.moveTo(a,U);x.lineTo(a,B);x.stroke();x.setLineDash([]);x.fillStyle=C.pilot;x.font='700 18px system-ui';x.fillText(lang==='tr'?'LA başlangıcı':'LA start',a+8,U+25);x.fillStyle=C.hot;x.fillText('DR',L+W*280/300-5,U+50);x.fillStyle=C.muted;x.font='20px system-ui';x.fillText(lang==='tr'?'Çalışma basıncı [bar]':'Working pressure [bar]',500,B+62);return B+95}function table(x,h,r,y,c){const w=1068,R=58;let a=86;x.font='700 18px system-ui';h.forEach((v,i)=>{const z=c[i]*w;x.fillStyle=C.ink;x.fillRect(a,y,z,R);x.fillStyle='white';wrap(x,v,a+8,y+24,z-16,22,2);a+=z});y+=R;x.font='18px system-ui';r.forEach((row,j)=>{a=86;row.forEach((v,i)=>{const z=c[i]*w;x.fillStyle=j%2?'#f8f7f2':'white';x.fillRect(a,y,z,R);x.strokeStyle=C.line;x.strokeRect(a,y,z,R);x.fillStyle=C.ink;wrap(x,String(v),a+7,y+23,z-14,21,2);a+=z});y+=R});return y+14}function pages(){let p=[];let c,x,y;[c,x]=page();y=head(x,'HYDRAULIC ENGINEERING',T.title,T.sub);y=call(x,T.core,T.coreb,y);pump(x,y+10);x.fillStyle=C.muted;x.font='20px system-ui';wrap(x,T.source,86,1455,1068,30,3);foot(x,1);p.push(c);[c,x]=page();y=head(x,'A10VO LA',T.why,T.sub);y=body(x,T.whyb,y);y=H(x,T.eq,y+15);y=formulas(x,y);y=call(x,lang==='tr'?'Mühendislik çıkarımı':'Engineering deduction',T.eqnote,y+10);y=H(x,T.loop,y+20);y=body(x,T.loopb,y);pump(x,y+5);foot(x,2);p.push(c);[c,x]=page();y=head(x,'OPERATING MAP',T.regions,T.sub);y=chart(x,y);y=body(x,T.r1,y);y=body(x,T.r2,y);y=body(x,T.r3,y);foot(x,3);p.push(c);[c,x]=page();y=head(x,'WORKED EXAMPLE',T.ex,T.sub);y=call(x,lang==='tr'?'Varsayımlar ve tork ayarı':'Assumptions and torque setting',T.exnote,y);const r=lang==='tr'?[['80','71.1','101.3','98.4','15.46','Vg max'],['104','70.8','100.8','127.3','20.0','LA başlar'],['150','49.1','69.9','127.3','20.0','LA'],['200','36.8','52.4','127.3','20.0','LA'],['250','29.4','42.0','127.3','20.0','LA'],['280','→ min','→ min','düşer','düşer','DR']]:[['80','71.1','101.3','98.4','15.46','Vg max'],['104','70.8','100.8','127.3','20.0','LA starts'],['150','49.1','69.9','127.3','20.0','LA'],['200','36.8','52.4','127.3','20.0','LA'],['250','29.4','42.0','127.3','20.0','LA'],['280','→ min','→ min','falls','falls','DR']];y=table(x,lang==='tr'?['p [bar]','Vg','q','M','Pmil','Durum']:['p [bar]','Vg','q','M','Pshaft','Mode'],r,y+25,[.11,.17,.17,.14,.16,.25]);y=body(x,lang==='tr'?'250 bar’da LA olmasaydı pompa tam deplasmanda yaklaşık 307 Nm ve 48 kW isterdi. LA, Vg’yi yaklaşık 29.4 cm³/dev’e indirerek torku yaklaşık 127 Nm’de tutar.':'At 250 bar without LA, a full-displacement pump would demand roughly 307 Nm and 48 kW. LA reduces Vg to about 29.4 cm³/rev and holds torque near 127 Nm.',y+18);foot(x,4);p.push(c);[c,x]=page();y=head(x,'CONTROLLER CLASSES',T.cls,T.sub);y=body(x,T.clsn,y);y=table(x,['Class','Start [bar]','NG45','NG71','NG100','NG140','NG180'],[['LA5','≤50','≤42','≤67','≤94','≤132','≤167'],['LA6','51–90','42–76','67–121','94–169','132–237','167–302'],['LA7','91–160','76–134','121–213','169–299','237–418','302–540'],['LA8','161–240','134–202','213–319','299–449','418–629','540–810'],['LA9','>240','>202','>319','>449','>629','>810']],y+10,[.10,.16,.14,.14,.15,.15,.16]);y=H(x,T.variants,y+35);y=body(x,T.v1,y);y=body(x,T.v2,y);y=body(x,T.v3,y);y=body(x,T.v4,y);y=call(x,lang==='tr'?'Kontrol önceliği':'Control priority',T.priority,y+18);foot(x,5);p.push(c);[c,x]=page();y=head(x,'ALGO TEAM',T.test,T.sub);y=body(x,T.testb,y);y=H(x,T.notes,y+25);y=body(x,T.notesb,y);y=call(x,lang==='tr'?'Kaynak ve izlenebilirlik':'Source and traceability',T.source,y+20);x.fillStyle=C.ink;x.font='700 28px system-ui';x.fillText('algo-team.com/hydraulic-simulator/',86,y+290);x.fillStyle=C.accent;x.fillText('algo-team.com/hydraulic-simulator/la-power-controller/',86,y+335);foot(x,6);p.push(c);return p}async function go(){if(!window.jspdf){document.getElementById('msg').textContent='jsPDF load failed.';return}btn.disabled=true;document.getElementById('msg').textContent=T.working;await new Promise(r=>setTimeout(r,30));const a=pages(),{jsPDF}=window.jspdf,d=new jsPDF({orientation:'portrait',unit:'pt',format:'a4',compress:true});for(let i=0;i<a.length;i++){if(i)d.addPage();d.addImage(a[i].toDataURL('image/jpeg',.9),'JPEG',0,0,595.28,841.89,undefined,'FAST')}d.save(T.file);document.getElementById('msg').textContent=T.ready;btn.disabled=false}btn.addEventListener('click',go)})();</script></body></html>
