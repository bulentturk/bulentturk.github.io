name: Refresh Makine Nabzı sector feed

# /news/ sayfasındaki "son başlıklar" şeridi kardeş sitenin haber RSS
# akışından beslenir. Haftalık çalışır, yalnızca başlıklar değiştiyse
# commit atar; bu commit normal deploy iş akışını tetikler.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sector-feed
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
      - name: Pull the latest headlines
        working-directory: source
        run: node scripts/fetch_sector_feed.mjs
      - name: Commit when the headlines changed
        run: |
          if git diff --quiet -- source/src/content/sector-feed.json; then
            echo "Sector feed is already up to date."
            exit 0
          fi
          git config user.name "algo-team-feed[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add source/src/content/sector-feed.json
          git commit -m "Makine Nabzı son başlıklarını yenile"
          git push
