name: Build and deploy GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install documentation and browser test dependencies
        run: |
          python3 -m pip install PyMuPDF==1.26.7 playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Type-check
        run: npm run typecheck
      - name: Test LA equations
        run: node --test tests/la-model.test.mjs
      - name: Build full Rev B guides and manufacturer schematics
        run: python3 scripts/build_la_assets.py
      - name: Build
        run: npm run build
      - name: Test built laboratory and language-selected PDF downloads
        run: python3 tests/la-browser.py
      - name: Test full bilingual Learn articles and navigation
        run: python3 tests/la-guide-browser.py
      - name: Test DBC guide SEO and content preservation
        run: python3 tests/dbc-guide-browser.py
      - name: Test J1939 metadata and decoder behavior
        run: python3 tests/j1939-dtc-seo.py
      - name: Save J1939 visual QA
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: j1939-dtc-qa
          path: source/.test-artifacts/j1939-dtc/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save DBC guide visual QA
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: dbc-guide-qa
          path: source/.test-artifacts/dbc-guide/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save Learn visual QA
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: la-learn-qa
          path: source/.test-artifacts/la-guide/
          if-no-files-found: ignore
          retention-days: 7
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: source/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
      - name: Verify published DBC and J1939 pages
        timeout-minutes: 5
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          import json
          import os
          import time
          from urllib.request import Request, urlopen

          class Head(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_title = False
                  self.title = ''
                  self.description = ''
                  self.canonical = ''
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if tag == 'title': self.in_title = True
                  if tag == 'meta' and a.get('name') == 'description': self.description = a.get('content', '')
                  if tag == 'link' and a.get('rel') == 'canonical': self.canonical = a.get('href', '')
              def handle_endtag(self, tag):
                  if tag == 'title': self.in_title = False
              def handle_data(self, data):
                  if self.in_title: self.title += data

          pages = [
              (
                  'https://algo-team.com/learn/dbc-dosyasi-nedir/',
                  'DBC Nedir? CAN Bus Mesajlarını Örnekle Okuyun | ALGO TEAM',
                  'DBC dosyası ne işe yarar, nasıl okunur? CAN verisini devir ve sıcaklık gibi değerlere çeviren sinyal tanımlarını örneklerle öğrenin; editörde deneyin.',
                  'CAN Bus mesajlarındaki ham verinin motor devri',
              ),
              (
                  'https://algo-team.com/j1939-dtc-decoder/',
                  'J1939 DM1 Decoder: SPN/FMI Arıza Kodu Çözücü | ALGO TEAM',
                  'J1939 DM1 (PGN 65226) mesajını çözün: SPN, FMI, OC, lamba durumları ve BAM/TP.DT. TRC, ASC, CSV ve SocketCAN kayıtlarını tarayıcıda analiz edin.',
                  'DM1 çözümlemek için DBC dosyası gerekir mi?',
              ),
          ]
          for canonical, expected, description, fragment in pages:
              address = canonical + '?deploy_check=' + os.environ['GITHUB_SHA']
              for attempt in range(12):
                  try:
                      request = Request(address, headers={'Cache-Control': 'no-cache', 'User-Agent': 'ALGO-TEAM-Publication-Check/1.0'})
                      with urlopen(request, timeout=10) as response:
                          assert response.status == 200
                          html = response.read().decode('utf-8')
                      head = Head()
                      head.feed(html)
                      assert head.title == expected, 'Waiting for updated title'
                      assert head.description == description, 'Waiting for updated description'
                      assert head.canonical == canonical, 'Incorrect canonical'
                      assert fragment in html, 'Missing prerendered content'
                      print('LIVE PASS: ' + json.dumps({'url': canonical, 'status': 200, 'title': head.title, 'description': head.description, 'prerendered_content': True}, ensure_ascii=False))
                      break
                  except Exception as error:
                      if attempt == 11: raise
                      print(f'Publication check {attempt + 1}/12: {error}')
                      time.sleep(4)
          PY
