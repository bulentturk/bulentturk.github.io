name: Build and deploy GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install documentation and browser test dependencies
        run: |
          python3 -m pip install PyMuPDF==1.26.7 playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Type-check
        run: npm run typecheck
      - name: Test LA equations
        run: node --test tests/la-model.test.mjs
      - name: Build full Rev B guides and manufacturer schematics
        run: python3 scripts/build_la_assets.py
      - name: Build
        run: npm run build
      - name: Test built laboratory and language-selected PDF downloads
        run: python3 tests/la-browser.py
      - name: Test full bilingual Learn articles and navigation
        run: python3 tests/la-guide-browser.py
      - name: Test DBC guide SEO and content preservation
        run: python3 tests/dbc-guide-browser.py
      - name: Save DBC guide visual QA
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: dbc-guide-qa
          path: source/.test-artifacts/dbc-guide/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save Learn visual QA
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: la-learn-qa
          path: source/.test-artifacts/la-guide/
          if-no-files-found: ignore
          retention-days: 7
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: source/dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
